<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Table</title>
    </head>
    <body>
        <center>
            <h1>Student Information</h1>
            <table border="1">
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                </tr>
                <tr>
                    <td>John Doe</td>
                    <td>16</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>17</td>
                    <td>B+</td>
                </tr>
                <tr>
                    <td>Emily Johnson</td>
                    <td>15</td>
                    <td>A-</td>
                </tr>
            </table>
        </center>
    </body>
    </html>
